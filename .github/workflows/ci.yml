name: TaskFlow CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      SECRET_KEY: test-secret-key
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/taskflow_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/taskflow_test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskflow_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d taskflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Build Docker image
        run: docker build -t taskflow-api:test .

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker tag taskflow-api:test ghcr.io/mahid385/taskflow-api:latest
          docker tag taskflow-api:test ghcr.io/mahid385/taskflow-api:${{ github.sha }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker push ghcr.io/mahid385/taskflow-api:latest
          docker push ghcr.io/mahid385/taskflow-api:${{ github.sha }}